<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Warm Circular Editorial Background Surface -->
  <circle cx="32" cy="32" r="30" fill="#FFF7E8" stroke="#D9CFB9" stroke-width="2.5" />
  <circle cx="32" cy="32" r="26" fill="#F5EBD6" />

  <!-- Warm Mustard Sun Disk -->
  <circle cx="32" cy="32" r="13" fill="#D8B35F" />

  <!-- Directional Compass Pivot Needles -->
