  <polygon points="32,9 37,27 32,32" fill="#E58B70" />
  <polygon points="32,9 27,27 32,32" fill="#C95F48" />

  <!-- South Point: Deep Ink & Muted Teal -->
  <polygon points="32,55 37,37 32,32" fill="#466E67" />
  <polygon points="32,55 27,37 32,32" fill="#293C3A" />

  <!-- East Point: Terracotta & Mustard -->
  <polygon points="55,32 37,37 32,32" fill="#C95F48" />
  <polygon points="55,32 37,27 32,32" fill="#D8B35F" />

  <!-- West Point: Deep Ink & Muted Teal -->
  <polygon points="9,32 27,27 32,32" fill="#293C3A" />
  <polygon points="9,32 27,37 32,32" fill="#466E67" />

  <!-- Center Pivot Core Dial -->
  <circle cx="32" cy="32" r="4.5" fill="#FFF7E8" stroke="#293C3A" stroke-width="2" />
  <circle cx="32" cy="32" r="1.5" fill="#C95F48" />
